<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dodge Game</title>

<style>
    body {
        text-align: center;
        font-family: Arial;
        background: #111;
        color: white;
    }

    #gameArea {
        width: 400px;
        height: 500px;
        background: black;
        margin: auto;
        position: relative;
        overflow: hidden;
        border: 3px solid white;
    }

    #player {
        width: 50px;
        height: 50px;
        background: cyan;
        position: absolute;
        bottom: 10px;
        left: 175px;
    }

    .enemy {
        width: 40px;
        height: 40px;
        background: red;
        position: absolute;
        top: 0;
    }

    #score {
        margin: 10px;
        font-size: 20px;
    }

    #gameOver {
        display: none;
        font-size: 30px;
        color: red;
    }
</style>
</head>

<body>

<h1>🔥 Dodge the Enemies</h1>
<p id="score">Score: 0</p>
<p id="gameOver">BODO NOOB GAY</p>

<div id="gameArea">
    <div id="player"></div>
</div>

<script>
let player = document.getElementById("player");
let gameArea = document.getElementById("gameArea");
let scoreDisplay = document.getElementById("score");
let gameOverText = document.getElementById("gameOver");

let playerX = 175;
let score = 0;
let gameRunning = true;

// starts at 10
let speed = 10;

// player movement
document.addEventListener("keydown", function(e) {
    if (!gameRunning) return;

    if (e.key === "ArrowLeft" && playerX > 0) {
        playerX -= 25;
    }
    if (e.key === "ArrowRight" && playerX < 350) {
        playerX += 25;
    }
    player.style.left = playerX + "px";
});

// create enemies
function createEnemy() {
    if (!gameRunning) return;

    let enemy = document.createElement("div");
    enemy.classList.add("enemy");

    let x = Math.floor(Math.random() * 360);
    enemy.style.left = x + "px";

    gameArea.appendChild(enemy);

    let fall = setInterval(() => {
        if (!gameRunning) {
            clearInterval(fall);
            return;
        }

        let enemyTop = enemy.offsetTop;
        enemy.style.top = enemyTop + speed + "px";

        // 💥 Collision detection
        if (
            enemyTop > 450 &&
            enemy.offsetLeft < playerX + 50 &&
            enemy.offsetLeft + 40 > playerX
        ) {
            gameOver();
        }

        // Remove when out
        if (enemyTop > 500) {
            enemy.remove();
            clearInterval(fall);
        }

    }, 20);
}

// speed naik every second
setInterval(() => {
    if (gameRunning && speed < 50) {
        speed += 1;
    }
}, 1000);

// score system
setInterval(() => {
    if (!gameRunning) return;
    score++;
    scoreDisplay.innerText = "Score: " + score;
}, 500);

// spawn enemies 
let enemyInterval = setInterval(createEnemy, 600);

// tamattt 
function gameOver() {
    gameRunning = false;
    gameOverText.style.display = "block";
    clearInterval(enemyInterval);
}
</script>

</body>
</html>
